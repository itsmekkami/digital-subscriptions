services:
  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: digital-subscriptions-backend:1.0
    build: ./backend
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD}@db:5432/subscriptions
      PAYMENT_SERVICE_URL: http://payment-service:8001
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8002
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      payment-service:
        condition: service_started
      subscription-service:
        condition: service_started
    restart: unless-stopped

  payment-service:
    image: digital-subscriptions-payment:1.0
    build: ./payment-service
    expose:
      - "8001"
    restart: unless-stopped
  
  subscription-service:
    image: digital-subscriptions-subscription:1.0
    build: ./subscription-service
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD}@db:5432/subscriptions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d subscriptions"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
